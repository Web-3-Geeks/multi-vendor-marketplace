server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite puts hashed file names under /assets, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /products/123 has no file on disk, so serve index.html and let
    # React Router pick the page (same job as the rewrite in vercel.json).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

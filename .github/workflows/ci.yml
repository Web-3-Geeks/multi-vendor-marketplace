# Runs on every push and pull request. A change only counts as good when all three
# jobs are green; the deploy job (added after Render is set up) will depend on them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The tests start an in-memory MongoDB; keep its ~100 MB binary between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Only proves the bundle builds; the real URL is set where it is deployed.
          VITE_API_URL: http://localhost:5000/api

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marketplace-api ./backend
      - run: docker build -t marketplace-web ./frontend

  # Continuous deployment: only a push to main whose tests and builds all passed gets
  # here. The hosts' own git auto-deploy is off, so this is the only way to release.
  deploy:
    name: Deploy to Render + Vercel
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://multi-vendor-marketplace-weld.vercel.app
    env:
      HEALTH_URL: https://multi-vendor-marketplace-api.onrender.com/api/health
    steps:
      # The hook URLs are secrets: anyone holding one can trigger a deploy.
      - name: Trigger backend deploy (Render)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" > /dev/null
      - name: Trigger frontend deploy (Vercel)
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" > /dev/null

      # Render builds the Docker image and swaps it in only once /api/health passes,
      # so wait until the health check reports this commit.
      - name: Wait for the new backend to go live
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 30 "$HEALTH_URL" || true)
            echo "[$i] $body"
            if echo "$body" | grep -q "\"status\":\"ok\"" && echo "$body" | grep -q "\"version\":\"$want\""; then
              echo "Live: $want"
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not report version $want within 15 minutes"
          exit 1

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Vite puts hashed file names under /assets, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # SPA fallback: /products/123 has no file on disk, so serve index.html and let
    # React Router pick the page (same job as the rewrite in vercel.json).
    # nginx drops server-level add_header lines inside a location that has its own,
    # so the security headers are set here, next to Cache-Control.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ /index.html;
    }
}
